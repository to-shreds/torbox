name: Drive adversarial state

on:
  push:
    branches: [feature/google-drive-automation]
    paths: [.github/workflows/drive-adversarial-state.yml]

permissions:
  contents: read

jobs:
  state-attack:
    if: github.repository == 'to-shreds/torbox' && github.ref == 'refs/heads/feature/google-drive-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_BASE: bb3680e2c205b5beb10cb63dd55f746db33167c8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove this gate did not alter the implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_BASE'],'HEAD']).decode().splitlines())
          expected={'.github/workflows/drive-adversarial-security.yml','.github/workflows/drive-adversarial-state.yml'}
          assert changed == expected, f'Implementation changed after pre-adversarial verification: {sorted(changed)}'
          PY
      - name: Attack state-machine and recovery invariants statically
        shell: bash
        run: |
          mkdir -p adversarial-evidence
          python3 - <<'PY'
          from pathlib import Path
          failures=[]
          def need(cond,msg):
              if not cond: failures.append(msg)
          runner=Path('app/src/main/java/app/jabs/torboxdrop/drive/DriveAutomationRunner.kt').read_text()
          need('downloadFinished && item.downloadPresent' in runner,'authoritative readiness conjunction missing')
          need('DriveFileState.UNCERTAIN' in runner,'ambiguous submission review state missing')
          need('markAmbiguousIfStale' in runner,'stale ambiguous submission is not quarantined')
          need('getJobsByHash' in runner and 'priorJobIds' in runner,'pre-POST job baseline reconciliation missing')
          store=Path('app/src/main/java/app/jabs/torboxdrop/drive/DriveStore.kt').read_text()
          need('CONFLICT_REPLACE' not in store,'replace semantics can overwrite durable Drive state')
          need('DriveFileState.SUBMITTING' in store and 'DriveFileState.COMPLETE' in store,'submission journal states missing')
          need('account_scope' in store,'Drive journal is not account-scoped')
          matcher=Path('app/src/main/java/app/jabs/torboxdrop/drive/DriveQueuedMatcher.kt').read_text()
          need('sourceHash' in matcher,'queue activation lost exact hash correlation')
          worker=Path('app/src/main/java/app/jabs/torboxdrop/notifications/CompletionMonitorWorker.kt').read_text()
          need('driveAutomationRunner()?.runOnce()' in worker,'WorkManager does not run Drive work independently')
          service=Path('app/src/main/java/app/jabs/torboxdrop/notifications/CompletionMonitorService.kt').read_text()
          need('driveAutomationRunner()?.runOnce()' in service,'live monitor does not include Drive work')
          restore=Path('app/src/main/java/app/jabs/torboxdrop/notifications/RestoreMonitoringReceiver.kt').read_text()
          need('CompletionMonitorScheduler.hasDriveWork(context)' in restore,'reboot/package replacement can lose Drive fallback')
          container=Path('app/src/main/java/app/jabs/torboxdrop/AppContainer.kt').read_text()
          for marker in ['scheduleFallback(appContext)','runSoon(appContext)','startFromUserAction(appContext)']:
              need(marker in container,f'newly armed Drive work missing {marker}')
          vm=Path('app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt').read_text()
          need('preferences.googleDriveByDefault = it' not in vm,'per-torrent override still mutates global Drive default')
          repo=Path('app/src/main/java/app/jabs/torboxdrop/data/TorBoxRepository.kt').read_text()
          need('runCatching { onDriveWatchArmed() }' in repo,'scheduler failure can turn durable Drive admission into failed add')
          if failures: raise SystemExit('\n'.join(failures))
          Path('adversarial-evidence/STATE_STATIC.txt').write_text('PASS\n' + '\n'.join([
              'Ready state requires download_finished and download_present.',
              'Durable journal is account-scoped and monotonic with no replace-overwrite path.',
              'Ambiguous POST outcomes are quarantined rather than automatically replayed.',
              'Queue activation remains exact-hash correlated.',
              'Foreground, WorkManager and reboot restoration all retain Drive work.',
              'Per-torrent Drive choice does not mutate the remembered global default.',
              'Scheduler failure cannot turn a remote-successful add into a duplicate invitation.'
          ]) + '\n')
          PY
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Attack duplicate, loss, restart, queue, account and recovery paths
        run: |
          ./gradlew --no-daemon testDebugUnitTest \
            --tests '*DriveAutomationTest' \
            --tests '*DriveJournalTest' \
            --tests '*DriveIdentityTest' \
            --tests '*DriveAdmissionAndConnectionTest' \
            --tests '*CompletionMonitorRunnerTest' \
            --tests '*AddFlowSourceTest'
      - name: Full suite replay after adversarial targeting
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Record Gate 8 result
        run: |
          printf '%s\n' \
            'GATE 8 STATE AND RECOVERY ADVERSARIAL REVIEW: PASS' \
            "Source: $SOURCE_BASE" \
            'Duplicate submission, ambiguous response, process restart, concurrent runner, account replacement, queue activation, deletion and background recovery controls passed targeted and full-suite replay.' \
            'Physical-device process death, Android vendor scheduling and live TorBox/Google responses remain external checks and are not represented as passed.' \
            > adversarial-evidence/GATE8.txt
      - uses: actions/upload-artifact@v7
        with:
          name: drive-gate8-state-evidence
          path: |
            adversarial-evidence/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

name: APK Catcher isolated build

on:
  push:
    branches: [build/apk-catcher-20260907]
    paths:
      - 'apk-catcher/**'
      - '.github/workflows/apk-catcher.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out isolated helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Test, compile, and validate APK
        run: bash apk-catcher/build.sh
      - name: Upload APK and verification files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apk-catcher-build
          path: |
            apk-catcher/out/APK-Catcher-unsigned.apk
            apk-catcher/out/apksigner.jar
            apk-catcher/out/badging.txt
            apk-catcher/out/manifest.txt
            apk-catcher/out/tests.txt
          if-no-files-found: error
          retention-days: 7

name: Drive pre-adversarial repair

on:
  push:
    branches: [feature/google-drive-automation]
    paths: [.github/workflows/drive-pre-adversarial-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'to-shreds/torbox' && github.ref == 'refs/heads/feature/google-drive-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_BASE: f69c961d4b1d5765ff9fb003a2784e6a711c1979
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard current source and apply only demonstrated fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          base = os.environ['SOURCE_BASE']
          changed = subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines()
          assert changed == ['.github/workflows/drive-pre-adversarial-repair.yml'], f'Unexpected concurrent changes: {changed}'

          def replace_once(path, old, new):
              p = pathlib.Path(path); text = p.read_text()
              assert text.count(old) == 1, f'Expected one repair target in {path}: {old[:80]!r}'
              p.write_text(text.replace(old, new))
              subprocess.run(['git','add',path], check=True)

          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt',
              '''    fun setAddOptions(options: AddOptions) {\n        options.sendToGoogleDrive?.let { preferences.googleDriveByDefault = it }\n        _uiState.update { it.copy(addOptions = options) }\n    }''',
              '''    fun setAddOptions(options: AddOptions) = _uiState.update { it.copy(addOptions = options) }''')

          repo = pathlib.Path('app/src/main/java/app/jabs/torboxdrop/data/TorBoxRepository.kt')
          text = repo.read_text()
          edits = [
              ('prepareDriveAdmission(options, DriveTorrentIdentity.fromMagnet(magnet), magnet, "New torrent")',
               'prepareDriveAdmission(options, DriveTorrentIdentity.fromMagnet(magnet), null, "New torrent")'),
              ('finishDriveAdmission(result, admission, magnet, "New torrent")',
               'finishDriveAdmission(result, admission, null, "New torrent")'),
              ('options: AddOptions, hash: String?, sourceValue: String, name: String,',
               'options: AddOptions, hash: String?, sourceValue: String?, name: String,'),
              ('result: AddResult, admission: DriveAdmission?, sourceValue: String, fallbackName: String,',
               'result: AddResult, admission: DriveAdmission?, sourceValue: String?, fallbackName: String,'),
              ('        onDriveWatchArmed()\n        return admission',
               '        runCatching { onDriveWatchArmed() }\n        return admission'),
          ]
          for old,new in edits:
              assert text.count(old) == 1, f'Expected one repository repair target: {old[:80]!r}'
              text = text.replace(old,new)
          repo.write_text(text); subprocess.run(['git','add',str(repo)], check=True)

          admission = pathlib.Path('app/src/test/java/app/jabs/torboxdrop/drive/DriveAdmissionAndConnectionTest.kt')
          text = admission.read_text()
          old = 'witnessed = runBlocking { store.runnableWatches(scope).single().sourceHash == hash }'
          new = 'witnessed = runBlocking { store.runnableWatches(scope).single().let { it.sourceHash == hash && it.sourceValue == null } }'
          assert text.count(old) == 1
          text = text.replace(old,new)
          marker = '''    @Test fun folderReservationSurvivesTorBoxSettingsFailureAndRetryReusesIt() = runBlocking {'''
          test = '''    @Test fun schedulerFailureBeforeRemoteCreateCannotAbortOrDuplicateAdd() = runBlocking {\n        var calls = 0; server.enqueue(added())\n        val result = repo { calls++; if (calls == 1) throw IllegalStateException("scheduler unavailable") }\n            .createMagnet(magnet, AddOptions(sendToGoogleDrive = true))\n        assertEquals("17", result.id); assertEquals(1, server.requestCount); assertTrue(calls >= 2)\n        assertEquals("17", store.runnableWatches(scope).single().downloadId)\n    }\n'''
          assert text.count(marker) == 1 and 'schedulerFailureBeforeRemoteCreateCannotAbortOrDuplicateAdd' not in text
          text = text.replace(marker, test + marker)
          admission.write_text(text); subprocess.run(['git','add',str(admission)], check=True)

          addtest = pathlib.Path('app/src/test/java/app/jabs/torboxdrop/AddFlowSourceTest.kt')
          text = addtest.read_text()
          marker = '    private fun findProjectRoot(): Path {'
          test = '''    @Test\n    fun perTorrentDriveOverrideDoesNotRewriteGlobalDefault() {\n        assertThat(viewModelSource)\n            .contains("fun setAddOptions(options: AddOptions) = _uiState.update { it.copy(addOptions = options) }")\n        assertThat(viewModelSource)\n            .doesNotContain("options.sendToGoogleDrive?.let { preferences.googleDriveByDefault = it }")\n    }\n\n'''
          assert text.count(marker) == 1 and 'perTorrentDriveOverrideDoesNotRewriteGlobalDefault' not in text
          addtest.write_text(text.replace(marker, test + marker)); subprocess.run(['git','add',str(addtest)], check=True)

          subprocess.run(['git','diff','--cached','--check'], check=True)
          PY
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Full regression suite
        run: ./gradlew --no-daemon clean testDebugUnitTest
      - name: Lint and both APK builds
        run: ./gradlew --no-daemon lintDebug assembleDebug assembleRelease
      - name: Commit only passing targeted fixes
        shell: bash
        run: |
          git diff --cached --check
          git config user.name 'to-shreds'
          git config user.email '254567709+to-shreds@users.noreply.github.com'
          git commit -m 'Harden Drive add intent privacy, scheduling recovery and per-torrent defaults'
          git push origin HEAD:refs/heads/feature/google-drive-automation

name: Verify explicit confirmation for external shares

on:
  push:
    branches: [fix/confirm-shared-add]
    paths: [.github/workflows/confirm-shared-add-fix.yml]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply targeted confirmation-flow correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, f"Expected exactly one match in {path}: {old[:80]!r}"
              p.write_text(s.replace(old, new, 1))

          # External text shares and deep links always stage on Add. Browser and clipboard retain
          # their own explicit instant-send controls.
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt',
              '''        val shouldAutoSend = when (source) {\n            // Browser magnets may auto-send only through receiveTrustedBrowserMagnet().\n            "browser-magnet" -> false\n            "browser", "browser-download" -> true\n            "clipboard" -> parsed.kind == InputParser.Kind.MAGNET && preferences.autoSendClipboardMagnets\n            else -> !preferences.confirmBeforeSending\n        }\n''',
              '''        val shouldAutoSend = when (source) {\n            // Anything arriving from another Android app is always staged on Add so the user can\n            // choose per-torrent options, including Google Drive, before TorBox sees it.\n            "android-share", "deep-link" -> false\n            // Browser magnets may auto-send only through receiveTrustedBrowserMagnet().\n            "browser-magnet" -> false\n            "browser", "browser-download" -> true\n            "clipboard" -> parsed.kind == InputParser.Kind.MAGNET && preferences.autoSendClipboardMagnets\n            else -> false\n        }\n''')

          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt',
              '''            BrowserNavigationPolicy.shouldAutoSendBrowserMagnet(\n                autoSendBrowserMagnets = preferences.autoSendBrowserMagnets,\n                confirmBeforeSending = preferences.confirmBeforeSending,\n            ) && container.tokenStore.hasToken()\n''',
              '''            BrowserNavigationPolicy.shouldAutoSendBrowserMagnet(\n                autoSendBrowserMagnets = preferences.autoSendBrowserMagnets,\n            ) && container.tokenStore.hasToken()\n''')

          # Torrent URI ingestion is staging only for Share, Open-with, picker, and any future URI
          # source. Submission only occurs when the user presses Add to TorBox.
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt',
              '''    fun receiveTorrentUri(\n        uri: Uri,\n        source: String,\n        options: AddOptions = _uiState.value.addOptions,\n    ) {\n''',
              '''    fun receiveTorrentUri(\n        uri: Uri,\n        source: String,\n    ) {\n''')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt',
              '''                val explicitlyChosenHere = source == "file-picker"\n                if (\n                    container.tokenStore.hasToken() &&\n                    !explicitlyChosenHere &&\n                    !preferences.confirmBeforeSending\n                ) {\n                    submitPendingTorrent(options)\n                }\n''',
              '''                // URI ingestion is staging only. Whether it came from Share, Open with, or the\n                // file picker, the user must press Add to TorBox after choosing the add options.\n''')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt',
              '''            is IncomingAdd.TorrentFile -> receiveTorrentUri(Uri.parse(incoming.uri), "file", options)\n''',
              '''            is IncomingAdd.TorrentFile -> receiveTorrentUri(Uri.parse(incoming.uri), "file")\n''')

          # The old global share-confirm preference is obsolete. Do not let it silently suppress
          # the separately configured browser-magnet behavior.
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/browser/BrowserNavigationPolicy.kt',
              '''    fun shouldAutoSendBrowserMagnet(\n        autoSendBrowserMagnets: Boolean,\n        confirmBeforeSending: Boolean,\n    ): Boolean = autoSendBrowserMagnets && !confirmBeforeSending\n''',
              '''    fun shouldAutoSendBrowserMagnet(autoSendBrowserMagnets: Boolean): Boolean =\n        autoSendBrowserMagnets\n''')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/data/AppPreferences.kt',
              '''    var confirmBeforeSending: Boolean\n        get() = preferences.getBoolean(KEY_CONFIRM, false)\n        set(value) = edit(KEY_CONFIRM, value)\n''',
              '')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/data/AppPreferences.kt',
              '        private const val KEY_CONFIRM = "confirm_before_sending"\n',
              '')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt',
              '        preferences.confirmBeforeSending = !next.autoSendSharedLinks\n',
              '')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/MainViewModel.kt',
              '        autoSendSharedLinks = !preferences.confirmBeforeSending,\n',
              '')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/ui/screens/SettingsScreen.kt',
              '    val autoSendSharedLinks: Boolean = true,\n',
              '')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/ui/screens/SettingsScreen.kt',
              '''                SettingsToggle(\n                    title = "Instantly send shared links",\n                    description = "Submit links shared to TorBox Drop immediately",\n                    checked = state.autoSendSharedLinks,\n                    icon = Icons.Rounded.FileDownload,\n                    onCheckedChange = {\n                        onSettingsChange(state.copy(autoSendSharedLinks = it))\n                    },\n                )\n''',
              '')
          replace_once(
              'app/src/main/java/app/jabs/torboxdrop/ui/screens/SettingsScreen.kt',
              'subtitle = "Sharing, clipboard detection, and notifications"',
              'subtitle = "Clipboard detection and notifications"')

          # Regression tests.
          replace_once(
              'app/src/test/java/app/jabs/torboxdrop/browser/BrowserNavigationPolicyTest.kt',
              '''    fun browserAutoSend_requiresBothInstantModeAndNoConfirmation() {\n        assertThat(BrowserNavigationPolicy.shouldAutoSendBrowserMagnet(true, false)).isTrue()\n        assertThat(BrowserNavigationPolicy.shouldAutoSendBrowserMagnet(true, true)).isFalse()\n        assertThat(BrowserNavigationPolicy.shouldAutoSendBrowserMagnet(false, false)).isFalse()\n        assertThat(BrowserNavigationPolicy.shouldAutoSendBrowserMagnet(false, true)).isFalse()\n    }\n''',
              '''    fun browserAutoSend_followsItsOwnExplicitSetting() {\n        assertThat(BrowserNavigationPolicy.shouldAutoSendBrowserMagnet(true)).isTrue()\n        assertThat(BrowserNavigationPolicy.shouldAutoSendBrowserMagnet(false)).isFalse()\n    }\n''')
          replace_once(
              'app/src/test/java/app/jabs/torboxdrop/AddFlowSourceTest.kt',
              '''    private val addScreenSource: String by lazy {\n        projectRoot.resolve("app/src/main/java/app/jabs/torboxdrop/ui/screens/AddScreen.kt").readText()\n    }\n''',
              '''    private val addScreenSource: String by lazy {\n        projectRoot.resolve("app/src/main/java/app/jabs/torboxdrop/ui/screens/AddScreen.kt").readText()\n    }\n    private val settingsSource: String by lazy {\n        projectRoot.resolve("app/src/main/java/app/jabs/torboxdrop/ui/screens/SettingsScreen.kt").readText()\n    }\n''')
          replace_once(
              'app/src/test/java/app/jabs/torboxdrop/AddFlowSourceTest.kt',
              '''    fun addDestinationNeverAutoSubmitsClipboardOrChosenTorrent() {\n        assertThat(viewModelSource).contains("_uiState.value.destination == AppDestination.ADD")\n        assertThat(viewModelSource).contains("!explicitlyChosenHere &&")\n        assertThat(viewModelSource).doesNotContain("explicitlyChosenHere || !preferences.confirmBeforeSending")\n    }\n''',
              '''    fun externalSharesAndTorrentUrisAlwaysStageForExplicitConfirmation() {\n        assertThat(viewModelSource).contains("\\\"android-share\\\", \\\"deep-link\\\" -> false")\n        assertThat(viewModelSource).contains("else -> false")\n        assertThat(viewModelSource).contains("URI ingestion is staging only")\n        assertThat(viewModelSource).doesNotContain("preferences.confirmBeforeSending")\n        assertThat(settingsSource).doesNotContain("Instantly send shared links")\n        assertThat(addScreenSource).contains("Text(\\\"Add to TorBox\\\")")\n    }\n''')

          # Version and concise documentation.
          replace_once('app/build.gradle.kts', '        versionCode = 20004\n', '        versionCode = 20005\n')
          replace_once('app/build.gradle.kts', '        versionName = "2.0.4"\n', '        versionName = "2.0.5"\n')
          replace_once(
              'README.md',
              '- Add accepts magnets, HTTP or HTTPS links, and `.torrent` content URIs from the picker or Android intents.\n',
              '- Add accepts magnets, HTTP or HTTPS links, and `.torrent` content URIs from the picker or Android intents.\n- Anything shared or externally opened into TorBox Drop is staged on Add and waits for **Add to TorBox**, so per-item options such as Google Drive can be reviewed before creation.\n')
          replace_once(
              'BUILD_NOTES.md',
              '## v2.0.4 Google Drive automation release candidate\n',
              '''## v2.0.5 targeted confirmation-flow correction\n\n- Android text shares now always stage the shared magnet or URL on Add instead of submitting immediately.\n- Shared or externally opened `.torrent` files now always finish parsing on Add and wait for the user to press **Add to TorBox**.\n- External `magnet:` deep links likewise stage on Add. This guarantees the per-torrent Google Drive, Queue, Cached Only, notification, seed, and ZIP choices are visible before creation.\n- Removed the obsolete **Instantly send shared links** setting. Browser-magnet and clipboard instant-send behavior remain independently controlled by their existing explicit settings.\n\n## v2.0.4 Google Drive automation release candidate\n''')

          p = Path('ACCEPTANCE_TESTS.md')
          s = p.read_text()
          s = s.replace('The v2.0.4 Google Drive release-candidate source passes', 'The v2.0.5 confirmation-flow source preserves the verified 2.0.4 Drive implementation and passes', 1)
          s = s.replace('| 1 | Android text share to TorBox still works | Requires real TorBox account/device/manual | Manifest and `MainActivity` handle `ACTION_SEND text/*`; live chooser-to-API flow remains to be exercised. |', '| 1 | Android text share stages Add and requires explicit confirmation | Automated source pass; device/manual remains | `ACTION_SEND text/*` routes to `android-share`; the view model explicitly disables auto-submit and displays Add before creation. |', 1)
          s = s.replace('| 2 | `magnet:` deep link still works | Requires real TorBox account/device/manual | Browsable magnet intent and native handoff are declared; live deep-link launch remains. |', '| 2 | External `magnet:` deep link stages Add and requires explicit confirmation | Automated source pass; device/manual remains | `deep-link` is an explicit no-auto-submit source; live Android launch remains. |', 1)
          s = s.replace('| 5 | `.torrent` intent is accepted | Requires real TorBox account/device/manual | Manifest SEND and VIEW torrent intent filters exist; provider-to-app interoperability remains. |', '| 5 | Shared/opened `.torrent` stages Add and requires explicit confirmation | Automated source pass; provider/manual remains | URI ingestion never submits; it parses and waits for **Add to TorBox** regardless of Share, Open with, or picker source. |', 1)
          p.write_text(s)

          # Fail closed if the obsolete behavior survives anywhere in production source.
          production = '\n'.join(p.read_text() for p in Path('app/src/main/java').rglob('*.kt'))
          assert 'confirmBeforeSending' not in production
          assert 'autoSendSharedLinks' not in production
          assert 'Instantly send shared links' not in production
          PY
          git diff --check
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Full regression, lint, and both APK builds
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Commit only after verification passes
        shell: bash
        run: |
          git rm .github/workflows/confirm-shared-add-fix.yml
          git diff --check
          git config user.name 'to-shreds'
          git config user.email '254567709+to-shreds@users.noreply.github.com'
          git add app README.md BUILD_NOTES.md ACCEPTANCE_TESTS.md
          git commit -m 'TorBox Drop 2.0.5: require confirmation for external shares'
          git push origin HEAD:refs/heads/fix/confirm-shared-add

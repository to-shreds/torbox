name: Export Android build tools temporary

on:
  push:
    branches: [feature/google-drive-automation]
    paths: [.github/workflows/export-build-tools-temporary.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v4
      - name: Install Build Tools 36.0.0
        run: sdkmanager "build-tools;36.0.0"
      - name: Verify signing tools exist
        run: |
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" --version
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -h >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: android-build-tools-36-signing
          path: ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0/
          if-no-files-found: error
          retention-days: 1

name: Publish verified TorBox Drop preview
on:
  push:
    paths:
      - ".github/workflows/publish-preview.yml"
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v7
        with:
          name: torbox-drop-2.1.5-preview
          run-id: 38658716427
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .verified-preview
      - name: Publish tested preview bytes
        run: |
          test -s .verified-preview/app-debug.apk
          test "$(file -b .verified-preview/app-debug.apk | cut -d' ' -f1)" = "Android" || unzip -t .verified-preview/app-debug.apk >/dev/null
          mkdir -p release
          cp .verified-preview/app-debug.apk release/TorBox-Drop-v2.1.5-preview.apk
          sha256sum release/TorBox-Drop-v2.1.5-preview.apk > release/SHA256SUMS-Preview-2.1.5.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/TorBox-Drop-v2.1.5-preview.apk release/SHA256SUMS-Preview-2.1.5.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified TorBox Drop 2.1.5 preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

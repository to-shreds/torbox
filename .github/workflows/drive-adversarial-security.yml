name: Drive adversarial security

on:
  push:
    branches: [feature/google-drive-automation]
    paths: [.github/workflows/drive-adversarial-security.yml]

permissions:
  contents: read

jobs:
  security-attack:
    if: github.repository == 'to-shreds/torbox' && github.ref == 'refs/heads/feature/google-drive-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_BASE: bb3680e2c205b5beb10cb63dd55f746db33167c8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove this gate did not alter the implementation
        run: |
          changed="$(git diff --name-only "$SOURCE_BASE" HEAD)"
          test "$changed" = ".github/workflows/drive-adversarial-security.yml"
      - name: Attack credential and OAuth boundaries statically
        shell: bash
        run: |
          mkdir -p adversarial-evidence
          python3 - <<'PY'
          from pathlib import Path
          failures=[]
          def need(cond,msg):
              if not cond: failures.append(msg)
          auth=Path('app/src/main/java/app/jabs/torboxdrop/drive/GoogleDriveAuthorizationManager.kt').read_text()
          need('https://www.googleapis.com/auth/drive.file' in auth,'drive.file scope missing')
          need('https://www.googleapis.com/auth/drive"' not in auth,'broad Drive scope present')
          need('grantedScopes' in auth and 'DRIVE_FILE_SCOPE' in auth,'granted scope not checked')
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          need('android:allowBackup="false"' in manifest,'backup not disabled')
          for f in ['app/src/main/java/app/jabs/torboxdrop/data/AppPreferences.kt','app/src/main/java/app/jabs/torboxdrop/drive/DriveStore.kt','app/src/main/java/app/jabs/torboxdrop/data/LocalStore.kt']:
              t=Path(f).read_text()
              need('google_token' not in t and 'googleAccessToken' not in t and 'accessToken' not in t,f'Google bearer persistence marker in {f}')
          integ=Path('app/src/main/java/app/jabs/torboxdrop/data/TorBoxDriveIntegrationClient.kt').read_text()
          need('retryOnConnectionFailure(false)' in integ,'TorBox Drive POST client can automatically retry')
          need('followRedirects(false)' in integ and 'followSslRedirects(false)' in integ,'TorBox Drive client can follow credential redirects')
          need('"google_token"' in integ,'TorBox documented google_token body field missing')
          google=Path('app/src/main/java/app/jabs/torboxdrop/drive/GoogleDriveApiClient.kt').read_text()
          need('retryOnConnectionFailure(false)' in google,'Google bearer client can automatically retry')
          need('followRedirects(false)' in google and 'followSslRedirects(false)' in google,'Google bearer client can follow redirects')
          repo=Path('app/src/main/java/app/jabs/torboxdrop/data/TorBoxRepository.kt').read_text()
          need('DriveTorrentIdentity.fromMagnet(magnet), null, "New torrent"' in repo,'raw magnet is still persisted in Drive journal')
          prod=list(Path('app/src/main/java/app/jabs/torboxdrop/drive').glob('*.kt'))+[Path('app/src/main/java/app/jabs/torboxdrop/data/TorBoxDriveIntegrationClient.kt')]
          for p in prod:
              t=p.read_text()
              need('Log.' not in t and 'println(' not in t and 'printStackTrace' not in t,f'logging surface found in {p}')
          secure=Path('app/src/main/java/app/jabs/torboxdrop/data/SecureTokenStore.kt').read_text()
          need('noBackupFilesDir' in secure and 'AndroidKeyStore' in secure,'TorBox token storage boundary weakened')
          if failures:
              raise SystemExit('\n'.join(failures))
          Path('adversarial-evidence/SECURITY_STATIC.txt').write_text('PASS\n' + '\n'.join([
              'OAuth scope is drive.file and returned scopes are checked.',
              'Google bearer tokens are absent from preferences and SQLite stores.',
              'TorBox and Google credential-bearing clients reject redirects and automatic retry.',
              'Drive magnet journals retain hash identity without the raw magnet URL.',
              'Application backup remains disabled and the TorBox credential remains in no-backup AndroidKeyStore-backed storage.',
              'No production Drive logging calls were found.'
          ]) + '\n')
          PY
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Attack executable security boundaries
        run: |
          ./gradlew --no-daemon testDebugUnitTest \
            --tests '*DriveBoundaryTest' \
            --tests '*DriveAdmissionAndConnectionTest' \
            --tests '*ProjectSecurityInvariantsTest' \
            --tests '*AddFlowSourceTest'
      - name: Record Gate 7 result
        run: |
          printf '%s\n' \
            'GATE 7 SECURITY ADVERSARIAL REVIEW: PASS' \
            "Source: $SOURCE_BASE" \
            'Credential redirect, replay, sanitization, persistence, scope, backup, account and magnet-journal boundaries passed static and executable attacks.' \
            'Live Google consent and a live TorBox-to-Drive transfer are external checks and are not represented as passed.' \
            > adversarial-evidence/GATE7.txt
      - uses: actions/upload-artifact@v7
        with:
          name: drive-gate7-security-evidence
          path: |
            adversarial-evidence/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

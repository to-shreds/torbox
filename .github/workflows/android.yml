name: Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "release/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Clean build outputs
        run: ./gradlew --no-daemon clean

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build unsigned release APK and shrink check
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: torbox-drop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: torbox-drop-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Build separately installable preview APK
        run: ./gradlew --no-daemon assembleDebug -PdropPreview --rerun-tasks

      - name: Upload preview APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: torbox-drop-2.1.5-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish preview APK in release directory
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk release/TorBox-Drop-v2.1.5-preview.apk
          sha256sum release/TorBox-Drop-v2.1.5-preview.apk > release/SHA256SUMS-Preview-2.1.5.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/TorBox-Drop-v2.1.5-preview.apk release/SHA256SUMS-Preview-2.1.5.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish separately installable TorBox Drop 2.1.5 preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

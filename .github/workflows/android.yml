name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, debug APK, and release shrink check
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: torbox-drop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: torbox-drop-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Bundle APK signing utilities
        if: success()
        run: |
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" signing-tools/lib64/

      - name: Upload APK signing utilities
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-signing-tools
          path: signing-tools/
          if-no-files-found: error

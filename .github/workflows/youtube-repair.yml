name: YouTube repair verification
on:
  push:
    branches: [fix/youtube-downloads]
permissions:
  contents: read
concurrency:
  group: youtube-repair
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.patch.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: patch
        name: Retain the existing explicit-confirmation source contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/jabs/torboxdrop/ui/screens/AddScreen.kt')
          old = 'Text(if (youtubeVideo != null && pendingTorrentName == null) "Download YouTube video" else "Add to TorBox")'
          new = 'if (youtubeVideo != null && pendingTorrentName == null) Text("Download YouTube video") else Text("Add to TorBox")'
          text = p.read_text()
          assert old in text or new in text
          p.write_text(text.replace(old, new))
          PY
          if ! git diff --quiet; then
            git add app/src/main/java/app/jabs/torboxdrop/ui/screens/AddScreen.kt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Keep explicit Add button branches without changing YouTube behavior'
            git push origin HEAD:refs/heads/fix/youtube-downloads
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web && git diff --exit-code web/index.html
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: youtube-web-verification
          path: |
            web/verification/
            web/index.html
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Native tests, lint, debug and release shrink checks
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: youtube-android-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Build side-by-side preview without replacing the installed signing identity
        run: |
          ./gradlew --no-daemon -PdropPreview=true assembleDebug
          mkdir -p /tmp/deliverables
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/deliverables/TorBox-Drop-v2.1.4-preview.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/deliverables/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs /tmp/deliverables/TorBox-Drop-v2.1.4-preview.apk > /tmp/deliverables/preview-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /tmp/deliverables/TorBox-Drop-v2.1.4-preview.apk > /tmp/deliverables/preview-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 /tmp/deliverables/TorBox-Drop-v2.1.4-preview.apk > /tmp/deliverables/preview-alignment.txt
          sha256sum /tmp/deliverables/*.apk > /tmp/deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: torbox-drop-youtube-apks
          path: /tmp/deliverables/

name: YouTube repair verification
on:
  push:
    branches: [fix/youtube-downloads]
permissions:
  contents: read
concurrency:
  group: youtube-repair
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.patch.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: patch
        name: Apply checksum-verified patch without changing other work
        run: |
          set -euo pipefail
          if [ ! -f app/src/main/java/app/jabs/torboxdrop/util/YouTubeLinks.kt ]; then
            cat repair/youtube-0.b64 repair/youtube-1.b64 repair/youtube-2.b64 | base64 -d | gzip -d > /tmp/youtube.patch
            echo '5110390e3c83a5446c773336e9a62d622d6750b4b64efc5d4d2c713ecfec8a28  /tmp/youtube.patch' | sha256sum -c -
            git apply --check /tmp/youtube.patch
            git apply /tmp/youtube.patch
            node web/build.mjs
            git add app web package.json package-lock.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Fix YouTube preparation and device download flow with regressions'
            git push origin HEAD:refs/heads/fix/youtube-downloads
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web && git diff --exit-code web/index.html
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: youtube-web-verification
          path: |
            web/verification/
            web/index.html
      - run: git archive --format=zip -o /tmp/torbox-source.zip HEAD
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: repaired-source
          path: /tmp/torbox-source.zip
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Native tests, lint, debug and release shrink checks
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: youtube-android-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Build side-by-side preview without replacing the installed signing identity
        run: |
          ./gradlew --no-daemon -PdropPreview=true assembleDebug
          mkdir -p /tmp/deliverables
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/deliverables/TorBox-Drop-v2.1.4-preview.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/deliverables/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs /tmp/deliverables/TorBox-Drop-v2.1.4-preview.apk > /tmp/deliverables/preview-signature.txt
          sha256sum /tmp/deliverables/*.apk > /tmp/deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: torbox-drop-youtube-apks
          path: /tmp/deliverables/

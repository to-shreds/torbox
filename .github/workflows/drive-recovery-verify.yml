name: Verify Drive recovery

on:
  push:
    branches: [feature/google-drive-automation]
    paths:
      - .github/workflows/drive-recovery-verify.yml
      - tools/drive-recovery/**

permissions:
  contents: write

concurrency:
  group: drive-recovery-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'to-shreds/torbox' && github.ref == 'refs/heads/feature/google-drive-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: 5a4d46bd6e0529121b1e9a7c16c8b4b6b8e62093
      PATCH_SHA256: 9f3d034bb65e06820dcaa9f40505316e416a64da9f0a1abf6f74aedf00c2fcc3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and apply recovered repairs
        shell: bash
        run: |
          mkdir -p recovery-evidence
          git rev-parse HEAD > recovery-evidence/RECOVERY_PARENT.txt
          python3 - <<'PY'
          import base64, bz2, hashlib, os, pathlib, subprocess
          base = os.environ['BASE']
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD']).decode().splitlines()
          allowed = lambda p: p.startswith('tools/drive-recovery/') or p == '.github/workflows/drive-recovery-verify.yml'
          assert all(allowed(p) for p in paths), 'Source changed since recovery base; refusing to overwrite'
          parts = [pathlib.Path(f'tools/drive-recovery/patch.b64.{i}').read_text().strip() for i in range(1, 5)]
          blob = lambda s: hashlib.sha1(('blob ' + str(len(s)) + '\0').encode() + s.encode()).hexdigest()
          expected = ['b0dcd5c6d113ab9c04a2caef2d590b51ff2ea8a4', '215cd0b2ed1057bb29062178db5eb8dc9bde6cb7', '76f972eb359a7c301adbde2a918dc2ec2ce57397', '5519d9fffe00b2df89b18dc183f5ccd39615d99c']
          assert [blob(s) for s in parts] == expected, 'Recovery part checksum mismatch'
          patch = bz2.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256'], 'Recovery patch checksum mismatch'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'drive-recovery.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)

          # Robolectric 4.16.1 uses the non-generic getApplication() API.
          tests = list(pathlib.Path('app/src/test/java/app/jabs/torboxdrop/drive').glob('*.kt')) + list(pathlib.Path('tools/drive-reproduction').glob('*.kt'))
          fixed_tests = []
          for test in tests:
              text = test.read_text()
              if 'RuntimeEnvironment.getApplication<Application>()' in text:
                  test.write_text(text.replace('RuntimeEnvironment.getApplication<Application>()', 'RuntimeEnvironment.getApplication()'))
                  fixed_tests.append(str(test))
          assert len(fixed_tests) == 4, 'Unexpected test harness correction scope'
          subprocess.run(['git', 'add', *fixed_tests], check=True)

          # The first repaired regression run exposed a real store split: Drive getters read
          # driveSetup while bind/reserve/clear wrote the ordinary behavior preferences file.
          # Keep connection state and owner scope together in driveSetup; keep only the behavioral
          # default in the resettable preferences file.
          pref = pathlib.Path('app/src/main/java/app/jabs/torboxdrop/data/AppPreferences.kt')
          text = pref.read_text()
          replacements = [
              ('preferences.getString("google_drive_owner_scope", null) == accountScope',
               'driveSetup.getString("google_drive_owner_scope", null) == accountScope'),
              ('check(preferences.edit().putString("google_drive_owner_scope", accountScope)\n            .putBoolean(KEY_GOOGLE_DRIVE_CONNECTED, true).commit()) { "Could not save Drive connection." }',
               'check(driveSetup.edit().putString("google_drive_owner_scope", accountScope)\n            .putBoolean(KEY_GOOGLE_DRIVE_CONNECTED, true).commit()) { "Could not save Drive connection." }'),
              ('check(preferences.edit().putString(KEY_GOOGLE_DRIVE_FOLDER_ID, id)\n            .putString(KEY_GOOGLE_DRIVE_FOLDER_NAME, name)\n            .putBoolean(KEY_GOOGLE_DRIVE_CONNECTED, false).commit()) { "Could not save Drive destination." }',
               'check(driveSetup.edit().putString(KEY_GOOGLE_DRIVE_FOLDER_ID, id)\n            .putString(KEY_GOOGLE_DRIVE_FOLDER_NAME, name)\n            .putBoolean(KEY_GOOGLE_DRIVE_CONNECTED, false).commit()) { "Could not save Drive destination." }'),
              ('fun clearDriveConnection() {\n        check(preferences.edit().remove("google_drive_owner_scope")\n            .remove(KEY_GOOGLE_DRIVE_FOLDER_ID).remove(KEY_GOOGLE_DRIVE_FOLDER_NAME)\n            .putBoolean(KEY_GOOGLE_DRIVE_CONNECTED, false)\n            .putBoolean(KEY_GOOGLE_DRIVE_DEFAULT, false).commit()) { "Could not clear Drive connection." }\n    }',
               'fun clearDriveConnection() {\n        check(preferences.edit().putBoolean(KEY_GOOGLE_DRIVE_DEFAULT, false).commit()) {\n            "Could not clear Drive automation default."\n        }\n        check(driveSetup.edit().remove("google_drive_owner_scope")\n            .remove(KEY_GOOGLE_DRIVE_FOLDER_ID).remove(KEY_GOOGLE_DRIVE_FOLDER_NAME)\n            .putBoolean(KEY_GOOGLE_DRIVE_CONNECTED, false).commit()) { "Could not clear Drive connection." }\n    }')
          ]
          for old, new in replacements:
              assert text.count(old) == 1, f'Expected exactly one AppPreferences repair target: {old[:60]}'
              text = text.replace(old, new)
          pref.write_text(text)
          subprocess.run(['git', 'add', str(pref)], check=True)

          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          pathlib.Path('recovery-evidence/PATCH_SHA256.txt').write_text(os.environ['PATCH_SHA256'] + '\n')
          pathlib.Path('recovery-evidence/TEST_HARNESS_FIX.txt').write_text('Use Robolectric 4.16.1 non-generic RuntimeEnvironment.getApplication() in:\n' + '\n'.join(fixed_tests) + '\n')
          pathlib.Path('recovery-evidence/PREFERENCE_STORE_FIX.txt').write_text('Drive connection, folder and owner scope now use torbox_drop_drive_setup_v1 consistently; behavioral default remains resettable.\n')
          subprocess.run(['git', 'diff', '--cached', '--binary'], stdout=open('recovery-evidence/applied-repairs.diff','wb'), check=True)
          PY
          tar -czf recovery-evidence/applied-source.tar.gz app/src app/build.gradle.kts tools/drive-reproduction
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test repaired implementation and all regressions
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean testDebugUnitTest 2>&1 | tee recovery-evidence/tests.log
      - name: Lint and both APK builds
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug assembleDebug assembleRelease 2>&1 | tee recovery-evidence/build.log
      - name: Commit only verified source and regression tests
        shell: bash
        run: |
          git diff --cached --check
          git config user.name 'to-shreds'
          git config user.email '254567709+to-shreds@users.noreply.github.com'
          git commit -m 'Repair Drive duplicate prevention, account isolation, durable admission and recovery; add regression tests'
          git rev-parse HEAD > recovery-evidence/SOURCE_COMMIT.txt
          git archive --format=zip --output=recovery-evidence/TorBox-Drive-source.zip HEAD
          sha256sum recovery-evidence/TorBox-Drive-source.zip app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk > recovery-evidence/SHA256SUMS.txt
          git push origin HEAD:refs/heads/feature/google-drive-automation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drive-recovery-evidence
          path: |
            recovery-evidence/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verified build candidates
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: drive-verified-build-candidates
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
